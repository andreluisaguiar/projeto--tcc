[project]
name = "projeto-tcc"
version = "1.0.0"
description = "NLP para Previsão de Engenharia a partir de Títulos de TCC no BICT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "selenium>=4.15.0",
    "spacy>=3.7.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "imbalanced-learn>=0.11.0",
    "nltk>=3.8.0",
    "joblib>=1.3.0",
    "seaborn>=0.12.0",
    "matplotlib>=3.8.0",
    "numpy>=1.24.0",
    "plotly>=5.18.0",
    "wordcloud>=1.9.0",
    "fpdf2>=2.7.9",
]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
